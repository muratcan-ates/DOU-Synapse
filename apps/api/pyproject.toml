[project]
name = "dou-synapse-api"
version = "0.1.0"
description = "DOU-Synapse — ders materyaliyle sınırlandırılmış RAG öğretim asistanı API'si"
readme = "README.md"
# 3.12'ye sabit: onnxruntime/fastembed (bge-m3) yeni Python sürümlerini geç destekliyor.
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Sürüm ARALIĞI değil ÜST SINIR da var: 0.8.0, e5-large'ı mean pooling ile
    # koşmaya geçtiğini yalnız bir uyarıyla söylüyor. Pooling değişikliği vektör
    # uzayını değiştirir; farklı sürümle embed edilmiş korpusa karşı sorgu
    # ÇÖKMEZ, sessizce yanlış komşu döndürür. Korpus 0.8.0 ile gömüldü
    # (`chunks.embedding_space` damgası bunu kayda geçiriyor, 0006).
    "fastembed>=0.8,<0.9",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "greenlet>=3.1",
    "email-validator>=2.2",
    # Faz B: sağlayıcı bağımsız LLM erişimi + Groq→Gemini failover.
    # Paralel geliştirme başlamadan önce eklendi; beş oturum aynı dosyaya
    # ayrı ayrı bağımlılık yazmasın diye.
    "litellm>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit
    "RUF",
]
ignore = [
    "S101",  # testlerde assert kullanımı normal
    "B008",  # FastAPI Depends() varsayılan argümanda kullanılır
    # Kod tabanı ve kullanıcıya dönen mesajlar Türkçedir; ı/ş/ğ karakterlerini
    # "belirsiz unicode" sayan kurallar burada tamamen yanlış pozitif üretir.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/"]
