name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The core pipeline only reads repository contents. Individual jobs must opt in
# explicitly if a future capability needs more authority.
permissions:
  contents: read

jobs:
  api:
    name: API — lint, tip, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Resmî Docker Hub index digest'i (0.8.6-pg16-bookworm, 2026-08-11).
        # Tag okunabilirlik içindir; digest mutable tag yeniden hedeflense de sabittir.
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PG_BIN: /usr/bin
      # conftest test DB adını TEST_DB_NAME'den (yoksa worktree slug'ından) türetir.
      # Bu satır olmadan runner'da ad dou_synapse_test_dou_synapse olur ve aşağıdaki
      # iki DSN başka bir veritabanını gösterir — PR #4'te 331 test kurulumda düştü.
      TEST_DB_NAME: dou_synapse_test
      TEST_ADMIN_DSN: postgresql+psycopg://postgres:postgres@localhost/dou_synapse_test
      TEST_APP_DSN: postgresql+psycopg://dou_app:dou_app_local@localhost/dou_synapse_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Değişen satır raporu PR tabanını ve main push öncesini karşılaştırır.
          fetch-depth: 0

      - name: PostgreSQL istemcisini kur
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Bağımlılıkları kur
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Biçim kontrolü
        run: uv run ruff format --check .

      - name: Tip kontrolü (mypy)
        run: uv run mypy app

      - name: API testleri ve gerçek satır kapsamı
        working-directory: .
        run: |
          uv run --project apps/api python scripts/diff_coverage_check.py collect \
            --output /tmp/api-diff-coverage.json -- -q

      - name: Değişen Python satırlarının kapsam raporu
        working-directory: .
        env:
          DIFF_COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Mevcut araç rapor kipindedir; ölçülmemiş bir oran geçiş eşiği yapılmaz.
          # Eksik/bozuk kanıt, taban hatası ve test başarısızlığı yine işi düşürür.
          uv run --project apps/api python scripts/diff_coverage_check.py report \
            --coverage /tmp/api-diff-coverage.json \
            --base "$DIFF_COVERAGE_BASE_SHA" --head "$(git rev-parse HEAD)"

      - name: Kod analizi araçlarının regresyon testleri
        working-directory: .
        run: |
          uv run --project apps/api python -m unittest \
            scripts.test_dead_code_check scripts.test_diff_coverage_check

      - name: Kullanılmayan Python tanımı adayları (uyarı)
        working-directory: .
        run: uv run --project apps/api python scripts/dead_code_check.py apps/api/app --warn-only

      - name: Retrieval ölçüm araçlarının çevrimdışı sözleşmeleri
        working-directory: .
        env:
          PYTHONPATH: apps/api:.
        run: |
          uv run --project apps/api python -m pytest -q -o asyncio_mode=auto \
            scripts/test_benchmark_retrieval_plan.py scripts/test_probe_retrieval_runtime.py

      - name: Yedek ve geri yükleme araçlarının çevrimdışı sözleşmeleri
        working-directory: .
        run: |
          uv run --project apps/api python scripts/test_recovery.py
          uv run --project apps/api python scripts/test_restore_protocol.py

      - name: E2E hedef ve süreç sahipliği sözleşmeleri
        working-directory: .
        run: |
          uv run --project apps/api python scripts/test_provision_ci_e2e.py
          uv run --project apps/api python scripts/test_owned_e2e.py

      - name: Yayın kanıtı doğrulayıcılarının regresyon testleri
        working-directory: .
        run: uv run --project apps/api python -m unittest discover -s .release -p 'test_*.py'

      - name: Rol farkındalıklı ajan uygulama mutasyonları
        working-directory: .
        run: |
          uv run --project apps/api python scripts/role_agent_application_mutation_check.py \
            --candidate-sha "$(git rev-parse HEAD)" \
            --evidence /tmp/role-agent-application-mutations.json

      # Göç numaraları sıranın TEK kaydı: her yerde `supabase/migrations/*.sql`
      # dosya adı sırasıyla uygulanıyor. Aynı numarayı iki dal birden
      # kullandığında (0016 bu depoda gerçekten oldu) git çakışma üretmez,
      # ikisi de uygulanır ve sıra alfabetik bir tesadüfe düşer. Kapı, birleşme
      # öncesinde bunu görünür kılar. 0017 `010-api-observability` dalında
      # rezerve; bilinçli boşluk açıkça bildirilir.
      - name: Göç numarası sözleşmesi
        working-directory: .
        run: |
          # 0017 ve runbook şeritleri 0021–0023 rezerve; B4 göçü 0024 ile başlar.
          # 0028 L4 şeridine ayrıldı; kota yarışı kanıtlanmadığı için göç yazılmadı,
          # L2 0027 ve L5 0029 birleşince boşluk kaldı (13–14 Eylül 2026).
          python3 scripts/migration_check.py --allow-gap 0017 --allow-gap 0021 --allow-gap 0022 --allow-gap 0023 --allow-gap 0028
          python3 -m unittest scripts.test_migration_check

      # Test SAYISI bu depoda kanıt olarak kullanılıyor (docs_check sayaçları,
      # dossier metrikleri). Yeşil yanan ama hiçbir şey ölçmeyen test o sayacı
      # şişirir. Bu kapı üç dar kusuru sözdiziminde yakalar; bulgu bilinçliyse
      # testin içinde gerekçeli muafiyet ister, sessiz geçiş yoktur.
      - name: Test kalite kapısı
        working-directory: .
        run: |
          python3 scripts/test_quality_check.py
          python3 -m unittest scripts.test_test_quality_check

      - name: RLS izolasyon kanıtı
        working-directory: .
        run: |
          # İki ayrı sessizlik kaynağı, iki ayrı kalkan:
          #  - `psql ... | tee` boru hattının ÇIKIŞ KODUNU yutuyordu (tee her zaman
          #    0 döner) -> `set -o pipefail`.
          #  - `psql -f` ON_ERROR_STOP olmadan SQL hatasında da 0 döner; betik
          #    yarıda kesilse bile "FAIL yazmadı" diye yeşil sayılırdı
          #    -> `-v ON_ERROR_STOP=1`. Ekrana FAIL yazmak SQL hatası DEĞİLDİR;
          #    ikisi ayrı arızadır ve ikisi de kapatılmalıdır.
          # `-X` psqlrc'yi devre dışı bırakır: geliştirici makinesindeki kişisel
          # ayar CI çıktısını değiştirmesin.
          set -euo pipefail
          psql -d postgres -c 'DROP DATABASE IF EXISTS rls_check'
          psql -d postgres -c 'CREATE DATABASE rls_check'
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -d rls_check -f "$f"; done
          # Testin gerçekten kırmızı yanabildiğini de doğrularız: politika bozulunca FAIL
          # çıkmalı, aksi halde test hiçbir şey kanıtlamıyor demektir.
          psql -X -v ON_ERROR_STOP=1 -d rls_check -f supabase/tests/rls_isolation.sql 2>&1 | tee /tmp/rls.out
          if grep -q FAIL /tmp/rls.out; then echo "RLS izolasyonu bozuk"; exit 1; fi
          psql -q -d rls_check -c "DROP POLICY chunks_member_read ON chunks;
                                   CREATE POLICY chunks_member_read ON chunks FOR SELECT USING (true);"
          psql -X -v ON_ERROR_STOP=1 -d rls_check -f supabase/tests/rls_isolation.sql 2>&1 | tee /tmp/rls_broken.out
          if ! grep -q FAIL /tmp/rls_broken.out; then
            echo "Politika bilerek bozuldu ama test yeşil kaldı — test bir şey kanıtlamıyor"; exit 1
          fi
          echo "RLS testi hem doğru hem kırmızı yanabiliyor"

      # Ölçme/analitik katmanının (0004 + 0005) RLS kanıtı — R3, T052.
      #
      # AYRI BİR VERİTABANI kullanır. Yukarıdaki adım `rls_check`'te
      # `chunks_member_read` politikasını bilerek BOZUK bırakıyor (mutasyon
      # denemesinin kendisi). Aynı veritabanında koşmak, bu adımın yanlış
      # sebeple kırmızı ya da yeşil yanmasına yol açardı.
      #
      # İki kapı birden: iddialar geçmeli VE politikalar bozulduğunda kırmızı
      # yanabildikleri gösterilmeli. Yanmayan test hiçbir şey kanıtlamaz.
      - name: Ölçme katmanı RLS kanıtı (rls_assessment)
        working-directory: .
        run: |
          set -euo pipefail
          psql -d postgres -c 'DROP DATABASE IF EXISTS rls_assessment_template'
          psql -d postgres -c 'CREATE DATABASE rls_assessment_template'
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -d rls_assessment_template -f "$f"
          done
          psql -X -v ON_ERROR_STOP=1 -d rls_assessment_template -f supabase/tests/rls_assessment.sql 2>&1 | tee /tmp/rls_a.out
          if grep -q FAIL /tmp/rls_a.out; then echo "assessment RLS bozuk"; exit 1; fi
          supabase/tests/rls_assessment_mutation_check.sh rls_assessment_template

      - name: Soru taslağı bütünlüğü ve eşzamanlılık mutasyonları
        working-directory: .
        run: supabase/tests/rls_question_authoring_mutation_check.sh rls_assessment_template

      - name: Rol farkındalıklı ajan RLS ve kota mutasyonları
        working-directory: .
        run: supabase/tests/rls_role_aware_agent_mutation_check.sh

      # Aşağıdaki beş kanıt depoda VARDI ama hiçbir iş akışı koşturmuyordu: yani
      # "politika bozulunca testimiz kırmızı yanar" iddiasının kanıtı yazılmış,
      # sonra rafta bırakılmıştı. Koşmayan kanıt kanıt değildir.
      - name: Çekirdek şema RLS mutasyon kanıtı
        working-directory: .
        run: supabase/tests/rls_isolation_mutation_check.sh

      - name: Blueprint RLS kanıtı ve mutasyonu
        working-directory: .
        run: |
          set -euo pipefail
          psql -d postgres -c 'DROP DATABASE IF EXISTS rls_blueprint_template'
          psql -d postgres -c 'CREATE DATABASE rls_blueprint_template'
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -d rls_blueprint_template -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -d rls_blueprint_template \
            -f supabase/tests/rls_blueprint.sql 2>&1 | tee /tmp/rls_bp.out
          if grep -q FAIL /tmp/rls_bp.out; then echo "blueprint RLS bozuk"; exit 1; fi
          supabase/tests/rls_blueprint_mutation_check.sh rls_blueprint_template

      - name: Soru taslağı RLS kanıtı
        working-directory: .
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d rls_assessment_template \
            -f supabase/tests/rls_question_authoring.sql 2>&1 | tee /tmp/rls_qa.out
          if grep -q FAIL /tmp/rls_qa.out; then echo "soru taslağı RLS bozuk"; exit 1; fi

      - name: Soru taslağı eşzamanlılık kanıtı
        working-directory: .
        run: uv run --project apps/api python supabase/tests/question_authoring_concurrency_check.py rls_assessment_template

      - name: Platform yönetim konsolu yetki mutasyonları
        working-directory: .
        run: supabase/tests/rls_portal_admin_mutation_check.sh

      # Aşağıdaki üç kanıt da depoda VARDI ama hiçbir iş akışı koşturmuyordu;
      # `scripts/ai_sdlc_check.py` artık çağrılmayan kanıt betiğini kırmızı yakıyor
      # (EVIDENCE_UNREACHABLE) ve bu üçünü o kural buldu.
      - name: Öğrenme olayları RLS kanıtı ve mutasyonu (0027)
        working-directory: .
        run: |
          set -euo pipefail
          psql -d postgres -c 'DROP DATABASE IF EXISTS rls_learning_template'
          psql -d postgres -c 'CREATE DATABASE rls_learning_template'
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -d rls_learning_template -f "$f"
          done
          # Önce iddialar bozulmamış şemada geçmeli...
          psql -X -v ON_ERROR_STOP=1 -d rls_learning_template \
            -f supabase/tests/rls_learning_events.sql 2>&1 | tee /tmp/rls_le.out
          if grep -q 'FAIL  ' /tmp/rls_le.out; then echo "learning_events RLS bozuk"; exit 1; fi
          # ...sonra her mutasyon ayrı kopyada kırmızı yanabilmeli.
          supabase/tests/rls_learning_events_mutation_check.sh rls_learning_template

      - name: Storage RLS kanıtı ve mutasyonu (0029, sentetik storage şeması)
        working-directory: .
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # Runner'ın yayımlanmış portu sunucuda Docker ağ adresi olarak görünür.
          # Yerel hedef korumasını koruyarak kanıtı bu işe ait PG hizmetinin
          # içinden, 127.0.0.1 üzerinden çalıştır. Yalnız göç ve test dosyaları taşınır.
          docker exec "$POSTGRES_SERVICE_ID" mkdir -p /tmp/dou-storage-ci/supabase/tests
          docker cp supabase/migrations "$POSTGRES_SERVICE_ID:/tmp/dou-storage-ci/supabase/"
          docker cp supabase/tests/rls_storage.sql "$POSTGRES_SERVICE_ID:/tmp/dou-storage-ci/supabase/tests/"
          docker cp supabase/tests/rls_storage_mutation_check.sh "$POSTGRES_SERVICE_ID:/tmp/dou-storage-ci/supabase/tests/"
          docker exec -i -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres \
            -e PGPASSWORD -w /tmp/dou-storage-ci "$POSTGRES_SERVICE_ID" bash -se <<'STORAGE'
          set -euo pipefail
          # Test yalnız dou_l5* adlı, çekirdek göçleri uygulanmış ve storage
          # şeması OLMAYAN veritabanında koşar. Sentetik şema her koşuda geri alınır.
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'DROP DATABASE IF EXISTS dou_l5_storage_ci'
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE dou_l5_storage_ci'
          for f in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -q -d dou_l5_storage_ci -f "$f"
          done
          psql -X -v ON_ERROR_STOP=1 -d dou_l5_storage_ci \
            -f supabase/tests/rls_storage.sql 2>&1 | tee /tmp/rls_storage.out
          grep -qx 'L5_STORAGE_BASELINE_PASS' /tmp/rls_storage.out
          bash supabase/tests/rls_storage_mutation_check.sh dou_l5_storage_ci
          STORAGE

      - name: Rol farkındalıklı ajan mutasyon aracının çevrimdışı sözleşmeleri
        working-directory: .
        env:
          PYTHONPATH: apps/api:.
        run: |
          uv run --project apps/api python -m pytest -q \
            scripts/test_role_agent_application_mutation_check.py

  image:
    name: API imajı — build + ağsız embedding kanıtı
    runs-on: ubuntu-latest
    # Model indirme + quantizasyon uzun sürer; hızlı geri bildirimi bloklamasın
    # diye ayrı iş. Push EDİLMEZ: burada sınanan şey imajın kurulabilirliği ve
    # çalışma zamanında ağa çıkmadığı.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Runner'da model (~2.1 GB) + quantizasyon için yer açılır. Yerel makinede
      # 9 Ağustos'ta ölçüldü: quantizasyon tepe diski ~4.5 GB isteyebiliyor.
      - name: Disk aç
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: İmajı kur
        run: docker build -t dou-synapse-api:ci apps/api

      - name: API belge varlıkları runtime imajında
        run: |
          docker run --rm --network none dou-synapse-api:ci python -c '
          import re
          from urllib.parse import urlsplit
          from pathlib import Path
          import app
          static_dir = Path(app.__file__).resolve().parent.parent / "static"
          shell = (static_dir / "docs.html").read_text()
          paths = set(re.findall(r"(?:src|href)=\"(/static/[^\"]+)\"", shell))
          assert paths, "belge varlıkları bulunamadı"
          for url in paths:
              path = static_dir / urlsplit(url).path.removeprefix("/static/")
              assert path.is_file() and path.stat().st_size > 0, url
          print("runtime belge varlıkları doğrulandı:", len(paths))
          '

      - name: İmaj boyutu
        run: |
          bytes=$(docker image inspect dou-synapse-api:ci --format '{{.Size}}')
          awk -v b="$bytes" 'BEGIN { printf "imaj boyutu: %.2f GB\n", b/1e9 }'

      # T048'in asıl iddiası: ağsız bir konteynerde embedding üretilebiliyor.
      # `--network none` olmadan bu adım hiçbir şey kanıtlamaz — model eksik olsa
      # bile çalışma zamanında indirilir ve test yeşil yanardı.
      - name: Ağsız konteynerde embedding üretimi
        run: |
          docker run --rm --network none dou-synapse-api:ci python -c "
          import os
          from app.modules.ingestion.embedding import FastEmbedProvider
          provider = FastEmbedProvider(cache_dir=os.environ['EMBEDDING_CACHE_DIR'])
          vector = provider.embed_query('deadlock için dört koşul nedir')
          assert len(vector) == 1024, len(vector)
          print('ağsız embedding üretildi, boyut:', len(vector))
          "

      # Build sırasında ölçülen int8 ↔ fp32 denkliği rapora çıkar. Kapı build'i
      # zaten düşürür; bu adım sayıyı GÖRÜNÜR kılar, çünkü "geçti" ile "ne kadar
      # payla geçti" aynı şey değil.
      - name: int8 ↔ fp32 denklik raporu
        run: |
          docker run --rm --network none dou-synapse-api:ci \
            cat /opt/models/embedding_bake_report.json

      - name: Replika belleği (RSS)
        run: |
          docker run --rm --network none --name rss-probe dou-synapse-api:ci python -c "
          import os, resource
          from app.modules.ingestion.embedding import FastEmbedProvider
          provider = FastEmbedProvider(cache_dir=os.environ['EMBEDDING_CACHE_DIR'])
          provider.embed_documents(['ısınma metni'] * 8)
          peak_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          peak_bytes = peak_kb * 1024
          limit_bytes = 4 * 1024**3
          print(f'model yüklü tepe RSS: {peak_bytes/1024**3:.2f} GiB (sınır 4 GiB)')
          assert peak_bytes < limit_bytes, (
              f'RSS sınırı aşıldı: {peak_bytes} >= {limit_bytes} byte'
          )
          "

  web:
    name: Web — lint, tip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOT: burada `if: hashFiles(...)` KULLANILAMAZ. hashFiles yalnız adım düzeyinde
    # (steps.*.if) tanımlıdır; job düzeyinde workflow dosyasının tamamı parse edilemez
    # ve HİÇBİR job çalışmaz (startup_failure). `apps/web` artık her zaman var.
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # A4' — `test.skip` / `test.fixme` sessiz yeşildir: süit geçer, kanıt yoktur.
      # Bağımlılık yok, yalnız git. `--untracked` henüz commit'lenmemiş dosyayı da
      # görür, böylece kapı yerelde de kanıtlanabilir. Tek satırlık `! git grep ...`
      # `set -e` altında rc>1 (grep hatası) durumunu yeşile çevirirdi; bu yüzden
      # "eşleşme var" ile "grep patladı" ayrı ayrı ele alınıyor. ESLint eklenmez (H5).
      - name: E2E süitinde devre dışı bırakılmış test yok
        shell: bash
        working-directory: .
        run: |
          status=0
          git grep -n --untracked -E 'test\.(skip|fixme)\(' -- apps/web/e2e || status=$?
          if [ "$status" -eq 0 ]; then
            echo "E2E süitinde test.skip/test.fixme var: sessiz yeşil kabul edilmez"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "git grep beklenmedik çıkış kodu verdi: $status"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Tam bağımlılık ağacında yüksek ve kritik güvenlik açıkları
        run: bun audit --audit-level high
      - run: bun run typecheck
      - run: bun test lib/
      # Kontrast kapısı: DESIGN.md "ölçülmüş AA" iddia ediyor ve bu iddianın tek
      # koruması bu adım. Betik her token çiftini iki temada ölçer ve eşiğin
      # altında kalan varsa sıfırdan farklı çıkar. 9 Ağustos'ta `--fg-subtle` 29
      # yerde AA'nın altındaydı ve kimse fark etmemişti; kapı olmadan aynı sapma
      # bir sonraki renk değişikliğinde sessizce geri gelir.
      - run: node scripts/contrast.mjs
      - run: bun run build

  docs:
    name: Belgeler — canlı sayı kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kendi işi, çünkü kapı HER İKİ araç zincirini birden ister: backend sayısı
    # `pytest --collect-only`den, frontend ve E2E sayıları `bun`dan gelir. `api` ya da
    # `web` işine iliştirilseydi kapı yalnız yarısını ölçebilir, kalanı için sabit sayıya
    # düşerdi — kapının varlık sebebi tam olarak o sabit sayıdır.
    #
    # Veritabanı YOK: `--collect-only` test toplar, koşturmaz; `playwright --list`
    # yapılandırmayı okur, sunucu ayağa kaldırmaz. Kapı saniyeler sürer ve `api`
    # işinin yavaş geri bildirimini beklemez.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: API bağımlılıkları
        working-directory: apps/api
        run: uv sync --extra dev --frozen

      - name: Web bağımlılıkları
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Belgelerdeki canlı sayılar ölçümle uyuşuyor mu
        run: node scripts/docs_check.mjs

  e2e:
    name: Uçtan uca — gerçek API + tarayıcı
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: PostgreSQL istemcisini kur
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: API ve web bağımlılıkları
        run: |
          uv sync --project apps/api --extra dev --frozen
          cd apps/web
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: İşe ait fresh PostgreSQL ve kontrollü E2E
        env:
          CI_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
          CI_SERVICE_HOST_PORT: "5432"
        run: |
          uv run --project apps/api python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          temporary = Path(os.environ['RUNNER_TEMP']).resolve()
          run_id = 'ci' + hashlib.sha256(
              (os.environ['GITHUB_RUN_ID'] + ':' + os.environ['GITHUB_RUN_ATTEMPT']).encode()
          ).hexdigest()[:16]
          provision_output = temporary / 'dou-e2e-owned-provision'
          measured_output = temporary / 'dou-e2e-owned-measured'
          subprocess.run([
              sys.executable, str(repo / 'scripts/provision_ci_e2e.py'),
              '--repo', str(repo), '--container-id', os.environ['CI_SERVICE_CONTAINER_ID'],
              '--port', os.environ['CI_SERVICE_HOST_PORT'], '--api-port', '8000',
              '--run-id', run_id, '--output', str(provision_output), '--execute',
          ], check=True)
          handoff = json.loads((provision_output / 'handoff.json').read_bytes())
          subprocess.run([
              sys.executable, str(repo / 'scripts/run_owned_e2e.py'), '--repo', str(repo),
              '--pins', handoff['pins'], '--pins-sha256', handoff['pinsSha256'],
              '--passfile', handoff['passfile'], '--run-id', handoff['runId'],
              '--output', str(measured_output), '--web-port', '3100',
          ], check=True)
          PY

      - name: E2E sahiplik ve test kanıtları
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-ownership-and-playwright
          path: |
            ${{ runner.temp }}/dou-e2e-owned-provision/*.json
            ${{ runner.temp }}/dou-e2e-owned-measured/*.json
            ${{ runner.temp }}/dou-e2e-owned-measured/*.log
            ${{ runner.temp }}/dou-e2e-owned-measured/audit/**/*.json
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
