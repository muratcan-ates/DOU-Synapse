# Point-in-time wake-up probes for a configured Supabase/API deployment.
# A green run means only that both probes answered during this invocation; it
# is not uptime monitoring, an SLO measurement or production readiness proof.
# Missing secrets are KEEPALIVE_NOT_CONFIGURED and fail red: a skipped green
# job must never be mistaken for a successful availability check.

name: Keepalive point-in-time probes

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# This workflow never needs repository or GitHub API access.
permissions: {}

jobs:
  ping:
    name: Yapılandırma önkoşulu + Supabase/API anlık probları
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Keepalive secrets yapılandırmasını fail-closed doğrula
        env:
          API_URL: ${{ secrets.KEEPALIVE_API_URL }}
          DATABASE_URL: ${{ secrets.KEEPALIVE_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$DATABASE_URL" ]] || missing+=(KEEPALIVE_DATABASE_URL)
          [[ -n "$API_URL" ]] || missing+=(KEEPALIVE_API_URL)
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=KEEPALIVE_NOT_CONFIGURED::Eksik GitHub Secret: ${missing[*]}"
            exit 1
          fi

      - name: Veritabanına salt okunur hafif sorgu
        env:
          DATABASE_URL: ${{ secrets.KEEPALIVE_DATABASE_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select 1" > /dev/null
          echo "veritabanı bu koşuda yanıt verdi"

      - name: API hazırlık ucunu yokla
        env:
          API_URL: ${{ secrets.KEEPALIVE_API_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(
              curl -sS -o /tmp/ready.json -w "%{http_code}" \
                --max-time 60 "${API_URL%/}/health/ready" || echo 000
            )"
            echo "deneme ${attempt}: HTTP ${code}"
            if [[ "$code" == "200" ]]; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 15
          done
          echo "API /health/ready beş denemede 200 vermedi" >&2
          cat /tmp/ready.json 2>/dev/null || true
          exit 1

      - name: Kanıt sınırını özete yaz
        if: ${{ success() }}
        run: |
          {
            echo "## Keepalive point-in-time result"
            echo
            echo "Database ve API bu koşu anında yanıt verdi."
            echo "Bu sonuç uptime/SLO/production readiness kanıtı değildir."
          } >> "$GITHUB_STEP_SUMMARY"
