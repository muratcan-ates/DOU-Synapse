name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, tip, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector'ü hazır getiren resmî imaj; CI'da eklenti derlemeye gerek kalmaz.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PG_BIN: /usr/bin
      TEST_ADMIN_DSN: postgresql+psycopg://postgres:postgres@localhost/dou_synapse_test
      TEST_APP_DSN: postgresql+psycopg://dou_app:dou_app_local@localhost/dou_synapse_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL istemcisini kur
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bağımlılıkları kur
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Biçim kontrolü
        run: uv run ruff format --check .

      - name: Tip kontrolü (mypy)
        run: uv run mypy app
        continue-on-error: true

      - name: Testler
        run: uv run pytest -q

      - name: RLS izolasyon kanıtı
        working-directory: .
        run: |
          psql -d postgres -c 'DROP DATABASE IF EXISTS rls_check'
          psql -d postgres -c 'CREATE DATABASE rls_check'
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -d rls_check -f "$f"; done
          # Testin gerçekten kırmızı yanabildiğini de doğrularız: politika bozulunca FAIL
          # çıkmalı, aksi halde test hiçbir şey kanıtlamıyor demektir.
          psql -d rls_check -f supabase/tests/rls_isolation.sql 2>&1 | tee /tmp/rls.out
          if grep -q FAIL /tmp/rls.out; then echo "RLS izolasyonu bozuk"; exit 1; fi
          psql -q -d rls_check -c "DROP POLICY chunks_member_read ON chunks;
                                   CREATE POLICY chunks_member_read ON chunks FOR SELECT USING (true);"
          psql -d rls_check -f supabase/tests/rls_isolation.sql 2>&1 | tee /tmp/rls_broken.out
          if ! grep -q FAIL /tmp/rls_broken.out; then
            echo "Politika bilerek bozuldu ama test yeşil kaldı — test bir şey kanıtlamıyor"; exit 1
          fi
          echo "RLS testi hem doğru hem kırmızı yanabiliyor"

  web:
    name: Web — lint, tip
    runs-on: ubuntu-latest
    # NOT: burada `if: hashFiles(...)` KULLANILAMAZ. hashFiles yalnız adım düzeyinde
    # (steps.*.if) tanımlıdır; job düzeyinde workflow dosyasının tamamı parse edilemez
    # ve HİÇBİR job çalışmaz (startup_failure). `apps/web` artık her zaman var.
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test lib/
      - run: bun run build

  e2e:
    name: Uçtan uca — gerçek API + tarayıcı
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # E2E kendi web sunucusunu 3100'de ayağa kaldırır; API 8000'de koşar.
      E2E_API_URL: http://localhost:8000
      E2E_PORT: 3100

    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL istemcisini kur
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2

      - name: Veritabanını kur
        run: |
          createdb dou_synapse
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -d dou_synapse -f "$f"; done
          psql -q -d dou_synapse -f supabase/local_dev_setup.sql
          psql -q -d dou_synapse -f supabase/seed_demo.sql

      - name: API'yi başlat
        working-directory: apps/api
        env:
          ENVIRONMENT: local
          DEV_AUTH_ENABLED: "true"
          DATABASE_URL: postgresql+psycopg://dou_app:dou_app_local@localhost/dou_synapse
          CORS_ORIGINS: '["http://localhost:3100"]'
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv run uvicorn app.main:app --port 8000 &
          # Hazır olana kadar bekle: uyku yerine yoklama, yavaş makinede de doğru.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json >/dev/null && break
            sleep 1
          done

      - name: Tarayıcıyı kur ve testleri koştur
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run test:e2e

      - name: Başarısızlık izlerini yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
